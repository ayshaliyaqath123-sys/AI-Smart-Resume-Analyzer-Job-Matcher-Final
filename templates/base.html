<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Resume Analyzer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('index') }}">
        <span class="brand-icon">🧠</span>
        <span>
          <span class="brand-title">AI Resume Analyzer</span>
          <span class="brand-subtitle">Smart career insights</span>
        </span>
      </a>
      <div class="navbar-nav ms-auto d-flex align-items-center gap-2">
        <a class="nav-link nav-pill" href="{{ url_for('index') }}">Resume Upload</a>
        <a class="nav-link nav-pill active" href="{{ url_for('chat_page') }}">AI Chatbot</a>
        {% if current_user %}
        <a class="nav-link nav-pill" href="{{ url_for('profile') }}">👤 Profile</a>
        <a class="nav-link nav-pill" href="{{ url_for('signout') }}">Sign out</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="py-4 py-lg-5">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="footer">
    <div class="container text-center small text-muted">
      Built for smarter resume screening, skill growth, and better career matching.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
