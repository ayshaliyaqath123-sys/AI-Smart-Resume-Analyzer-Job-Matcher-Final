-services:
  - type: web
    name: ai-smart-resume-analyzer
    env: python
    plan: free
    buildCommand: "python -m pip install --upgrade pip setuptools wheel && python -m pip install numpy==1.26.4 && pip install -r requirements.txt && python train_classifier.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
