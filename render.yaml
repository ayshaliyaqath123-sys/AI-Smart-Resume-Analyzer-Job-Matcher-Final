services:
  - type: web
    name: ai-smart-resume-analyzer
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python train_classifier.py"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
